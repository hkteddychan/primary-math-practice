<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4caf50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小學生數學練習｜文字題</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#e8f5e9,#f1f8e9);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#header{background:linear-gradient(135deg,#43a047,#66bb6a);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.18);flex-shrink:0}
#header h1{font-size:1.15rem;display:flex;align-items:center;gap:8px}
#header .score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:16px;font-size:.85rem;font-weight:700}
#app{flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;padding:14px}
.screen.active{display:flex}
/* Menu */
.title-big{text-align:center;font-size:1.6rem;font-weight:800;color:#2e7d32;margin:12px 0 4px}
.subtitle{text-align:center;color:#6b8e6b;margin-bottom:8px;font-size:1rem}
.explain-box{background:#e8f5e9;border:2px dashed #a5d6a7;border-radius:16px;padding:14px 16px;margin:12px 0;font-size:.92rem;color:#2e7d32;line-height:1.8}
.explain-box b{color:#1b5e20}
.explain-box .tiny{font-size:.78rem;color:#6b8e6b;margin-top:6px}
.grade-label{font-size:.9rem;font-weight:700;color:#2e7d32;margin:18px 0 8px}
.grade-row{display:flex;gap:8px;flex-wrap:wrap}
.grade-chip{padding:10px 14px;border-radius:18px;border:2px solid #a5d6a7;background:#fff;color:#2e7d32;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .15s;text-align:center}
.grade-chip:active{transform:scale(.95)}
.grade-chip.selected{background:#43a047;color:#fff;border-color:#43a047}
.grade-chip small{display:block;font-weight:400;font-size:.66rem;margin-top:2px;opacity:.8}
.launch-btn{margin-top:24px;background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff;border:none;padding:17px;border-radius:20px;font-size:1.15rem;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(46,125,50,.35);letter-spacing:1px}
.launch-btn:active{transform:scale(.97)}
.launch-btn:disabled{opacity:.4;cursor:not-allowed}
/* Step */
#step-ind{display:flex;gap:8px;margin:4px 0 10px;flex-shrink:0}
.step-pill{flex:1;background:#fff;border-radius:20px;padding:9px 6px;text-align:center;font-size:.78rem;font-weight:700;color:#999;border:2px solid #e0e0e0;opacity:.5;transition:all .2s}
.step-pill.active{opacity:1;border-color:#43a047;color:#2e7d32;background:#e8f5e9}
.step-pill.done{opacity:1;border-color:#81c784;color:#2e7d32;background:#c8e6c9}
/* Progress */
#progress-wrap{background:rgba(255,255,255,.6);border-radius:10px;height:12px;overflow:hidden;margin-bottom:10px;flex-shrink:0}
#progress-bar{height:100%;background:linear-gradient(90deg,#66bb6a,#43a047);width:0;border-radius:10px;transition:width .3s}
#q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-shrink:0}
#q-count{font-size:.85rem;color:#666;font-weight:600}
#q-topic{font-size:.85rem;color:#2e7d32;font-weight:700}
/* Word card (常駐文字題) */
#word-card{background:#fff3e0;border:2px solid #ffb74d;border-radius:16px;padding:14px 16px;margin-bottom:12px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
#word-card .wc-label{font-size:.72rem;color:#e65100;font-weight:700;display:flex;align-items:center;gap:6px}
#word-text{font-size:1.15rem;font-weight:700;color:#4e342e;line-height:1.7}
#word-card .wc-actions{display:flex;align-items:center;gap:10px}
#word-read-btn{background:#fff;border:2px solid #ffb74d;color:#e65100;font-size:1.2rem;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#word-read-btn:active{transform:scale(.9)}
#word-read-btn.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,183,77,.5)}50%{box-shadow:0 0 0 10px rgba(255,183,77,0)}}
/* Calc card */
#calc-card{background:#fff;border-radius:20px;padding:18px 16px;box-shadow:0 4px 16px rgba(0,0,0,.08);text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:230px}
#calc-title{font-size:.85rem;color:#888;font-weight:600;margin-bottom:6px}
#calc-display{font-size:2.2rem;font-weight:800;color:#2e7d32;line-height:1.45;margin-bottom:8px}
.vertical-calc{font-family:ui-monospace,Menlo,monospace;font-size:2rem;font-weight:700;color:#333;display:inline-block;line-height:1.45;text-align:right}
.vertical-calc .vc-line{border-bottom:3px solid #333;padding:0 18px}
/* Digit input */
#digit-row{display:flex;gap:10px;justify-content:center;margin:14px auto 4px;flex-wrap:wrap}
.digit-box{width:56px;height:64px;font-size:2rem;font-weight:800;text-align:center;border:3px solid #a5d6a7;border-radius:14px;outline:none;color:#2e7d32;background:#f1f8e9}
.digit-box:focus{border-color:#43a047;background:#fff}
.digit-box.done{border-color:#81c784;background:#e8f5e9}
.digit-box.correct{border-color:#43a047;background:#c8e6c9}
.digit-box.wrong{border-color:#e53935;background:#ffcdd2;color:#b71c1c}
#correct-msg{text-align:center;color:#2e7d32;font-weight:700;font-size:1rem;margin-top:8px;min-height:1.5em}
#feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:99;font-size:4rem;transition:transform .25s ease;pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.2)}
#feedback.show{transform:translate(-50%,-50%) scale(1)}
/* result */
.result-card{background:#fff;border-radius:24px;padding:30px 20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.result-score{font-size:3.2rem;font-weight:900;color:#2e7d32;margin:8px 0}
.result-stars{font-size:2.6rem;letter-spacing:6px;margin:6px 0}
.result-detail{color:#666;margin:8px 0;font-size:.95rem}
.result-msg{font-size:1.05rem;font-weight:700;color:#43a047;margin:10px 0}
.result-btn{display:block;width:100%;margin-top:14px;background:#43a047;color:#fff;border:none;padding:15px;border-radius:16px;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.result-btn.secondary{background:#fff;color:#43a047;border:2px solid #43a047}
.result-btn:active{transform:scale(.97)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.slide-in{animation:slideIn .3s ease}
/* UI refresh: warm classroom palette, clearer hierarchy, roomy cards */
:root{--ink:#17372d;--muted:#64766d;--green:#167a58;--green-dark:#105c44;--mint:#e8f5ee;--paper:#fffdf7;--line:#dbe9df;--amber:#f4a340;--shadow:0 16px 42px rgba(26,66,48,.09)}
body{color:var(--ink);background:radial-gradient(ellipse at 15% 0%,#dff3e7 0,transparent 42%),radial-gradient(ellipse at 90% 10%,#fff0d8 0,transparent 34%),#f6f8f3}
#header{background:linear-gradient(110deg,#145b45,#21805b);padding:14px clamp(16px,4vw,40px);box-shadow:0 5px 18px rgba(12,57,39,.17)}
#header h1{font-size:1.08rem;letter-spacing:.01em}
#header .score{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.14);padding:7px 14px}
#app{width:min(100%,900px);margin:0 auto;padding:clamp(12px,3vw,28px);}
.screen{padding:clamp(10px,2vw,18px)}
#scr-menu{justify-content:center;}
.title-big{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.04em;color:#174f3b;margin:12px 0 6px}
.subtitle{color:var(--muted);font-size:1rem;margin-bottom:18px}
.explain-box{background:rgba(255,255,255,.82);border:1px solid #cfe4d5;border-left:5px solid var(--green);border-radius:18px;padding:18px 20px;margin:14px 0;color:#315e49;box-shadow:0 7px 22px rgba(26,66,48,.045)}
.grade-label{font-size:.95rem;color:#315e49;margin:22px 0 10px}
.grade-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grade-chip{border:1px solid var(--line);border-radius:16px;padding:14px 10px;background:var(--paper);box-shadow:0 4px 12px rgba(26,66,48,.04);transition:transform .16s,box-shadow .16s,border-color .16s}
.grade-chip:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(26,66,48,.1);border-color:#8bc4a1}
.grade-chip.selected{background:linear-gradient(145deg,#21805b,#146145);border-color:#146145;box-shadow:0 8px 20px rgba(20,97,69,.22)}
.grade-chip small{font-size:.72rem;margin-top:5px}
.launch-btn{margin-top:22px;border-radius:16px;background:linear-gradient(110deg,#21805b,#146145);box-shadow:0 8px 20px rgba(20,97,69,.2);letter-spacing:.02em}
.launch-btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
#q-header{padding:0 2px}
#q-topic{font-size:.95rem;color:#176246}
#q-count{color:var(--muted)}
#step-ind{gap:10px;margin:8px 0 14px}
.step-pill{border:1px solid var(--line);border-radius:14px;padding:11px 8px;background:rgba(255,255,255,.82);font-size:.84rem}
.step-pill.active{border-color:#60ad7d;background:#e7f5eb;color:#145b3f;box-shadow:inset 0 0 0 1px #60ad7d}
.step-pill.done{border-color:#acd7b7;background:#f0f8ee;color:#35734d}
#progress-wrap{height:9px;background:#e2ebe2;border-radius:99px;margin-bottom:14px}
#progress-bar{background:linear-gradient(90deg,#70c18b,#167a58)}
#word-card{background:linear-gradient(135deg,#fff8e9,#fffdf7);border:1px solid #efd7ac;border-radius:20px;padding:16px 18px;box-shadow:0 8px 22px rgba(92,64,20,.06)}
#word-card .wc-label{font-size:.76rem;letter-spacing:.04em;color:#9b5d17}
#word-text{font-size:clamp(1.04rem,2.5vw,1.2rem);color:#463a29}
#word-read-btn{border:1px solid #e7bd7d;color:#8c5111;transition:transform .15s,background .15s}
#word-read-btn:hover{transform:scale(1.05);background:#fff9ed}
#calc-card{background:var(--paper);border:1px solid rgba(202,222,207,.8);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow);min-height:250px}
#calc-title{color:var(--muted);font-size:.9rem;letter-spacing:.02em}
#calc-display{color:#173f2f;font-size:clamp(2rem,6vw,2.8rem)}
.vertical-calc{color:#244a37;font-size:clamp(1.8rem,5vw,2.3rem)}
.vertical-calc .vc-line{border-color:#38694d}
#digit-row{gap:clamp(7px,2vw,12px);margin:18px auto 6px}
.digit-box{width:clamp(46px,12vw,60px);height:clamp(54px,14vw,68px);border:2px solid #b8d8c0;border-radius:15px;background:#f3f8f1;color:#175b40;transition:border-color .15s,box-shadow .15s,transform .15s}
.digit-box:focus{border-color:#21805b;box-shadow:0 0 0 4px rgba(33,128,91,.13);transform:translateY(-2px)}
#correct-msg{min-height:1.7em;color:#176246}
.result-card{background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.result-score{color:#176246}
.result-btn{background:linear-gradient(110deg,#21805b,#146145);border-radius:15px}
.result-btn.secondary{color:#176246;border-color:#8cbea0;background:transparent}
button:focus-visible,.grade-chip:focus-visible{outline:3px solid #e6a23c;outline-offset:3px}
@media(max-width:560px){#app{padding:10px}.screen{padding:8px}.grade-row{grid-template-columns:repeat(2,minmax(0,1fr))}.grade-chip{padding:13px 8px}#calc-card{min-height:220px;padding:20px 14px}#word-card{padding:13px 14px}#header h1{font-size:1rem}}
</style>
</head>
<body>

<div id="header">
  <h1>🧮 數學練習</h1>
  <div class="score" id="header-score">完成 0/10</div>
</div>

<div id="app">
  <!-- 主選單 -->
  <div class="screen active" id="scr-menu">
    <div class="title-big">小學生數學練習</div>
    <div class="subtitle">讀文字題，計一次答案！</div>
    <div class="explain-box">
      📌 <b>每題只需計一次</b>
      <br>📝 讀文字題 → ✏️ 填寫答案
      <br><span class="tiny">可用直式或心算，填入答案即可繼續。</span>
    </div>
    <div class="grade-label">📚 揀年級</div>
    <div class="grade-row" id="grade-row"></div>
    <button class="launch-btn" id="launch-btn" disabled>🚀 開始練習</button>
  </div>

  <!-- 答題 -->
  <div class="screen" id="scr-quiz">
    <div id="q-header">
      <span id="q-topic"></span>
      <span id="q-count">題 1/10</span>
    </div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <!-- 文字題常駐 -->
    <div id="word-card">
      <div class="wc-label">📝 文字題</div>
      <div id="word-text"></div>
      <div class="wc-actions">
        <button id="word-read-btn" class="pulse">🔊</button>
        <span style="font-size:.72rem;color:#999">撳掣聽題目</span>
      </div>
    </div>
    <!-- 計算區 -->
    <div id="calc-card">
      <div id="calc-title"></div>
      <div id="calc-display"></div>
      <div id="digit-row"></div>
      <div id="correct-msg"></div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="screen" id="scr-result">
    <div class="result-card">
      <div>🏁</div>
      <div class="result-score" id="r-score">0</div>
      <div class="result-detail" id="r-detail"></div>
      <div class="result-stars" id="r-stars">☆☆☆</div>
      <div class="result-msg" id="r-msg"></div>
      <button class="result-btn" id="r-again">🔁 再玩一次</button>
      <button class="result-btn secondary" id="r-menu">🏠 返主選單</button>
    </div>
  </div>
</div>

<div id="feedback">✅</div>

<script>
/* ═══════════ 年級設定 ═══════════ */
const GRADES = [
  {id:1, name:'小一', desc:'20 以內加減'},
  {id:2, name:'小二', desc:'100 加減・乘法'},
  {id:3, name:'小三', desc:'乘除・三位數'},
  {id:4, name:'小四', desc:'四則・多位數'}
];
const ROUND=10;
let selGrade=null;
let questions=[], qi=0, correct=0, totalAns=0;
let digitVals=[]; // 每步 digit 值

/* ═══════════ 題目生成 ═══════════ */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function genCore(grade){
  let a,b,op;
  if(grade===1){a=ri(1,18);b=ri(1,20-a);op=Math.random()<.5?'+':'-';if(op==='-'&&a<b)[a,b]=[b,a];}
  else if(grade===2){const m=Math.random();if(m<.45){a=ri(1,9);b=ri(1,9);op='×';}else if(m<.75){a=ri(0,89);b=ri(1,99-a);op='+';}else{a=ri(11,99);b=ri(1,a-1);op='-';}}
  else if(grade===3){const m=Math.random();if(m<.35){a=ri(2,9);b=ri(2,9);op='×';}else if(m<.6){a=ri(100,899);b=ri(1,99);op='+';}else if(m<.8){a=ri(100,999);b=ri(1,a-1);op='-';}else{a=ri(12,99);b=ri(2,9);op='×';}}
  else{const m=Math.random();if(m<.25){a=ri(12,99);b=ri(2,12);op='×';}else if(m<.5){a=ri(100,8999);b=ri(11,999);op='+';}else if(m<.75){a=ri(1000,9999);b=ri(11,999);op='-';}else{b=ri(2,12);const quotient=ri(2,99);a=b*quotient;op='÷';}}
  let ans = op==='+'?a+b : op==='-'?a-b : op==='×'?a*b : a/b;
  return {a,b,op,ans};
}
const CHARACTERS=['蒨妤','幸妤','高樂','爸爸','媽媽','子晴','姑媽'];

function makeWord(core){
  const pool=WORD_POOL[core.op]||WORD_POOL['+'];
  const tpl=pool[ri(0,pool.length-1)];
  const name=CHARACTERS[ri(0,CHARACTERS.length-1)];
  return {text:tpl.replace('{name}',name).replace('{a}',core.a).replace('{b}',core.b)};
}
function buildRound(){
  questions=[];
  for(let i=0;i<ROUND;i++){
    const core=genCore(selGrade);
    questions.push({core, word:makeWord(core)});
  }
}

/* ═══════════ 渲染 ═══════════ */
function questionDisplay(core){
  const sign=core.op==='×'?'×':core.op==='÷'?'÷':core.op;
  return `${core.a} ${sign} ${core.b} = ?`;
}
function renderQ(){
  const q=questions[qi];
  // 一題只顯示一次算式及一個答案，不再分直式／橫式重答
  document.getElementById('word-text').textContent=q.word.text;
  document.getElementById('calc-title').textContent='計算一次，填入答案';
  document.getElementById('calc-display').textContent=questionDisplay(q.core);
  // 題號/進度
  document.getElementById('q-topic').textContent=`${GRADES.find(g=>g.id===selGrade).name}・第 ${qi+1} 題`;
  document.getElementById('q-count').textContent=`題 ${qi+1}/${ROUND}`;
  document.getElementById('header-score').textContent=`完成 ${qi}/${ROUND}`;
  document.getElementById('progress-bar').style.width=`${(qi/ROUND)*100}%`;
  // 逐位 digit 輸入
  buildDigitInput();
  // 讀題
  document.getElementById('word-read-btn').classList.add('pulse');
  setTimeout(()=>speakWord(q.word.text),600);
  document.getElementById('correct-msg').textContent='';
}
function buildDigitInput(){
  const ans=questions[qi].core.ans;
  const ansStr=String(ans);
  const n=ansStr.length;
  digitVals=new Array(n).fill('');
  const row=document.getElementById('digit-row');
  row.innerHTML=ansStr.split('').map((_,i)=>`<input class="digit-box" maxlength="1" inputmode="numeric" type="tel" data-i="${i}">`).join('');
  const boxes=row.querySelectorAll('.digit-box');
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{
      const v=b.value.replace(/\D/g,'');
      b.value=v;
      digitVals[i]=v;
      b.classList.add('done');
      if(v!==''&&i<n-1)boxes[i+1].focus();
      if(digitVals.every(x=>x!==''))setTimeout(checkDigit,250);
    });
    b.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&b.value===''&&i>0)boxes[i-1].focus();
    });
  });
  boxes[0].focus();
}
function checkDigit(){
  if(document.getElementById('correct-msg').dataset.locked)return;
  document.getElementById('correct-msg').dataset.locked='1';
  const input=digitVals.join('');
  const answer=questions[qi].core.ans;
  const v=parseInt(input,10);
  // 標記
  const boxes=document.querySelectorAll('.digit-box');
  if(v===answer){
    boxes.forEach(b=>b.classList.add('correct'));
    correct++; showFeedback('✅');
    document.getElementById('correct-msg').innerHTML='👍 答啱!';
    document.getElementById('header-score').textContent=`答啱 ${correct}`;
    setTimeout(nextstep,1100);
  }else{
    // 顯示正確答案逐位
    const ansStr=String(answer).split('');
    boxes.forEach((b,i)=>{b.value=ansStr[i]||'';b.classList.add('wrong');});
    showFeedback('❌');
    document.getElementById('correct-msg').innerHTML=`正確答案係 <b>${answer}</b>`;
    setTimeout(nextstep,1500);
  }
}
function nextstep(){
  delete document.getElementById('correct-msg').dataset.locked;
  qi++;
  if(qi>=ROUND)showResult();
  else renderQ();
}
function speakWord(text){
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(text.replace(/[?？]/g,'。'));
  u.lang='zh-HK';u.rate=.9;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function showFeedback(e){const f=document.getElementById('feedback');f.textContent=e;f.classList.add('show');setTimeout(()=>f.classList.remove('show'),800);}
function showResult(){
  document.getElementById('scr-quiz').classList.remove('active');
  const steps=ROUND;
  const pct=correct/steps;
  document.getElementById('r-score').textContent=`${correct}/${steps}`;
  document.getElementById('r-detail').textContent=`完成 ${qi} 題，每題只答一次，共答啱 ${correct} 題`;
  document.getElementById('r-stars').textContent=pct>=.9?'⭐⭐⭐':pct>=.7?'⭐⭐':'⭐';
  document.getElementById('r-msg').textContent=
    pct>=.9?'🎉 好叻呀!數學小天才!':pct>=.7?'👍 做得好好!繼續努力!':'💪 加油!再試多一次會更好!';
  document.getElementById('scr-result').classList.add('active');
}

/* ═══════════ 事件 ═══════════ */
function renderMenu(){
  document.getElementById('grade-row').innerHTML=GRADES.map(g=>
    `<div class="grade-chip ${selGrade===g.id?'selected':''}" data-g="${g.id}">${g.name}<small>${g.desc}</small></div>`
  ).join('');
  document.querySelectorAll('.grade-chip').forEach(g=>g.addEventListener('click',()=>{selGrade=+g.dataset.g;renderMenu();}));
  document.getElementById('launch-btn').disabled=!selGrade;
}
document.getElementById('launch-btn').addEventListener('click',()=>{qi=0;correct=0;totalAns=0;buildRound();renderQ();go('scr-quiz');});
document.getElementById('word-read-btn').addEventListener('click',()=>{const q=questions[qi];if(q)speakWord(q.word.text);});
document.getElementById('r-again').addEventListener('click',()=>{qi=0;correct=0;totalAns=0;buildRound();renderQ();go('scr-quiz');});
document.getElementById('r-menu').addEventListener('click',()=>{go('scr-menu');renderMenu();});
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
renderMenu();
</script>
